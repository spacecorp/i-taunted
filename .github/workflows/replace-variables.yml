name: Replace @variables@ from JSON + Git Tag Version + Datetime

on:
  workflow_call:
    inputs:
      json_file:
        required: true
        type: string
      git_tag:
        required: true
        type: string

jobs:
  replace-vars:
    runs-on: ubuntu-latest
    outputs:
      target_dir: ${{ steps.set-vars.outputs.target_dir }}
      addon_name: ${{ steps.set-vars.outputs.addon_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read JSON variables
        id: set-vars
        run: |
          VARS=$(cat "${{ inputs.json_file }}")
          TARGET_DIR=$(echo "$VARS" | jq -r '.target_dir')
          ADDON_NAME=$(echo "$VARS" | jq -r '.addon_name')

          echo "TARGET_DIR=$TARGET_DIR" >> $GITHUB_OUTPUT
          echo "ADDON_NAME=$ADDON_NAME" >> $GITHUB_OUTPUT

          # Generate ISO datetime in UTC
          ISO_DATETIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "Replacing @datetime@ → $ISO_DATETIME"
          grep -rl "@datetime@" "$TARGET_DIR" | xargs sed -i "s|@datetime@|$ISO_DATETIME|g"

          # Change the game version based on tag
          VERSION="${{ inputs.git_tag }}"
          TARGET_DIR="${{ steps.set-vars.outputs.target_dir }}"
          echo "Replacing @version@ → $VERSION in $TARGET_DIR"
          grep -rl "@version@" "$TARGET_DIR" | xargs sed -i "s|@version@|${VERSION}|g"

          # Replace all other @key@ placeholders from JSON
          for key in $(echo "$VARS" | jq -r 'keys[]'); do
            # Skip dynamic fields
            if [[ "$key" == "target_dir" ]] || [[ "$key" == "addon_name" ]]; then
              continue
            fi
            value=$(echo "$VARS" | jq -r --arg k "$key" '.[$k]')
            echo "Replacing @$key@ → $value"
            grep -rl "@${key}@" "$TARGET_DIR" | xargs sed -i "s|@${key}@|${value}|g"
          done

