name: Build and Upload Addon with NPM

env:
  EXCLUDE_LIST: $(jq -r '.exclude[]' variables.json | sed 's/^/-x /')

on:
  push:
    tags:
      - '*'
    branches:
      - '**'       # Trigger on any branch push

jobs:
  replace-variables:
    uses: ./.github/workflows/replace-variables.yml
    with:
      json_file: variables.json
      git_tag: ${{ github.ref_name }}

  npm-build:
    runs-on: ubuntu-latest
    needs: replace-variables
    steps:
      - uses: actions/checkout@v4

      - name: Set target directory and addon name
        run: |
          TARGET_DIR="${{ needs.replace-variables.outputs.target_dir }}"
          ADDON_NAME="${{ needs.replace-variables.outputs.addon_name }}"
          echo "TARGET_DIR=$TARGET_DIR" >> $GITHUB_ENV
          echo "ADDON_NAME=$ADDON_NAME" >> $GITHUB_ENV

      - name: Install NPM dependencies
        working-directory: ${{ env.TARGET_DIR }}
        run: npm install

      - name: Compile addon
        working-directory: ${{ env.TARGET_DIR }}
        run: npm run compile

  pack-and-upload:
    runs-on: ubuntu-latest
    needs: npm-build
    steps:
      - uses: actions/checkout@v4

      - name: Set target directory and addon name
        run: |
          TARGET_DIR="${{ needs.replace-variables.outputs.target_dir }}"
          ADDON_NAME="${{ needs.replace-variables.outputs.addon_name }}"
          echo "TARGET_DIR=$TARGET_DIR" >> $GITHUB_ENV
          echo "ADDON_NAME=$ADDON_NAME" >> $GITHUB_ENV

      - name: Zip addon
        run: |
          echo "Excluding files/directories: $EXCLUDE_LIST"
          mkdir -p build
          # shellcheck disable=SC2086
          zip -r build/${ADDON_NAME}-${GITHUB_REF_NAME}.zip "${TARGET_DIR}" $EXCLUDE_LIST

    #   - name: Upload to CurseForge
    #     run: |
    #       ADDON_NAME="${{ env.ADDON_NAME }}"
    #       curl -X POST "https://wow.curseforge.com/api/projects/${{ secrets.CF_PROJECT_ID }}/upload-file" \
    #         -H "x-api-token: ${{ secrets.CF_API_TOKEN }}" \
