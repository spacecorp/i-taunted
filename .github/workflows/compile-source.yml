name: Build and Upload Addon

on:
  push:
    tags:
      - '*'
    branches:
      - '**'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout repository
      - uses: actions/checkout@v4

      - name: Determine addon version
        run: |
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]] || [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            else
            # Short git hash as fallback version
            VERSION=$(git rev-parse --short HEAD)
            fi

            echo "Using version: $VERSION"
            echo "VERSION=$VERSION" >> $GITHUB_ENV

      # 2️⃣ Read JSON variables and replace placeholders
      - name: Read variables and replace placeholders
        run: |
          VARS=$(cat addon-info.json)

          TARGET_DIR=$(echo "$VARS" | jq -r '.target_dir')
          ADDON_NAME=$(echo "$VARS" | jq -r '.addon_name')
          CURSEFORGE_PROJECT_ID=$(echo "$VARS" | jq -r '.curseforge_project_id')

          TARGET_DIR=$(realpath "$TARGET_DIR")
          echo "TARGET_DIR=$TARGET_DIR"
          echo "ADDON_NAME=$ADDON_NAME"
          echo "CURSEFORGE_PROJECT_ID=$CURSEFORGE_PROJECT_ID"

          # Set as environment variables for later steps
          echo "TARGET_DIR=$TARGET_DIR" >> $GITHUB_ENV
          echo "ADDON_NAME=$ADDON_NAME" >> $GITHUB_ENV
          echo "CURSEFORGE_PROJECT_ID=$CURSEFORGE_PROJECT_ID" >> $GITHUB_ENV

          # Generate ISO datetime
          ISO_DATETIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "Replacing @datetime@ → $ISO_DATETIME"
          grep -rl "@datetime@" "$TARGET_DIR" 2>/dev/null | xargs -r sed -i "s|@datetime@|$ISO_DATETIME|g"

          # Replace version from tag or use default branch name
          VERSION="${VERSION}"
          echo "Replacing @version@ → $VERSION in $TARGET_DIR"
          grep -rl "@version@" "$TARGET_DIR" 2>/dev/null | xargs -r sed -i "s|@version@|$VERSION|g"

          # Replace other @key@ placeholders from JSON
          for key in $(echo "$VARS" | jq -r 'keys[]'); do
            if [[ "$key" == "target_dir" ]] || [[ "$key" == "addon_name" ]] || [[ "$key" == "curseforge_project_id" ]]; then
              continue
            fi
            value=$(echo "$VARS" | jq -r --arg k "$key" '.[$k]')
            grep -rl "@${key}@" "$TARGET_DIR" 2>/dev/null | xargs -r sed -i "s|@${key}@|$value|g"
          done

      # 3️⃣ NPM install
      - name: Install NPM dependencies
        working-directory: ${{ env.TARGET_DIR }}
        run: npm install

      # 4️⃣ NPM compile
      - name: Compile addon
        working-directory: ${{ env.TARGET_DIR }}
        run: npm run compile

      # 5️⃣ Zip addon excluding files from JSON
      - name: Package addon into ZIP
        run: |
          EXCLUDE_LIST=$(jq -r '.exclude[]' addon-info.json | sed 's/^/-x /')
          echo "Excluding files/directories: $EXCLUDE_LIST"

          mkdir -p build
          # shellcheck disable=SC2086
          zip -r build/${ADDON_NAME}-${VERSION}.zip "${TARGET_DIR}" $EXCLUDE_LIST

      - name: Upload addon zip as artifact
        uses: actions/upload-artifact@v3
        with:
            name: ${ADDON_NAME}-${VERSION}
            path: build/${ADDON_NAME}-${VERSION}.zip

      # 6️⃣ Upload to CurseForge (optional)
      # - name: Upload to CurseForge
      #   run: |
      #     curl -X POST "https://wow.curseforge.com/api/projects/${{ env.CURSEFORGE_PROJECT_ID }}/upload-file" \
      #       -H "x-api-token: ${{ secrets.CF_API_TOKEN }}" \
      #       -F "file=@build/${ADDON_NAME}-${VERSION}.zip" \
      #       -F "metadata={\"changelog\":\"Auto build for $VERSION\",\"releaseType\":\"release\",\"gameVersions\":[${{ secrets.CF_GAME_VERSION_IDS }}]}"
